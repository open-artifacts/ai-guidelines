# Avisa (por PR) quando sai versao nova da imagem base da API e das actions.
version: 2
updates:
  - package-ecosystem: docker
    directory: /api
    schedule:
      interval: monthly
    ignore:
      # Versoes pares do Node sao LTS; as impares perdem suporte em poucos meses.
      # Dentro da 22 o Dependabot segue avisando; trocar de versao maior e manual.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    ignore:
      # Em 2026-11 as versoes 5 destas duas acoes foram revertidas: o deploy do Pages
      # nao terminava. Reavalie com um run manual (workflow_dispatch) antes de aceitar.
      - dependency-name: actions/upload-pages-artifact
        update-types: ["version-update:semver-major"]
      - dependency-name: actions/deploy-pages
        update-types: ["version-update:semver-major"]
