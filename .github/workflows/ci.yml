name: CI

# Os mesmos passos que o AGENTS.md pede antes de abrir um PR.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm test
        working-directory: api

  scripts-e-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: shellcheck deploy/*.sh
      - run: ALLOWED_ORIGIN=https://exemplo.org docker compose config -q
      - run: docker compose -f compose.dev.yaml config -q
