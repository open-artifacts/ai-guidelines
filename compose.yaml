# PRODUCAO (VPS): a API e, opcionalmente, o proxy HTTPS. O site fica no GitHub Pages.
#   docker compose up -d --build                    -> so a API, em 127.0.0.1:3000
#   docker compose --profile https up -d --build    -> API + HTTPS automatico (portas 80/443)
# Para rodar tudo localmente, use compose.dev.yaml.
name: ai-guidelines

services:
  api:
    build: ./api
    restart: unless-stopped
    environment:
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:?defina ALLOWED_ORIGIN no arquivo .env}
      # Vazio = usa o padrao da API (veja api/README.md).
      MAX_RATING_ID: ${MAX_RATING_ID:-}
      RATE_LIMIT_READS: ${RATE_LIMIT_READS:-}
      RATE_LIMIT_WRITES: ${RATE_LIMIT_WRITES:-}
    volumes:
      - api-data:/data
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    # Isolamento: so o volume /data e gravavel; sem privilegios; recursos limitados
    # (a VPS pode ser compartilhada com outros sites) e logs com tamanho maximo.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  proxy:
    profiles: ["https"]
    image: caddy:2
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN:-}   # obrigatorio so com --profile https
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - proxy-data:/data
      - proxy-config:/config

volumes:
  api-data:
  proxy-data:
  proxy-config:
