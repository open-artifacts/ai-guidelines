# So a API (escuta apenas em 127.0.0.1:3000):
#   docker compose up -d --build
# API + HTTPS automatico (Caddy nas portas 80/443, so se estiverem livres):
#   docker compose --profile https up -d --build
services:
  api:
    build: ./server
    restart: unless-stopped
    environment:
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:?defina ALLOWED_ORIGIN no arquivo .env}
      MAX_RATING_ID: ${MAX_RATING_ID:-17}
    volumes:
      - votes-data:/data
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"

  caddy:
    profiles: ["https"]
    image: caddy:2
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN:-}   # obrigatorio so com --profile https
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  votes-data:
  caddy-data:
  caddy-config:
